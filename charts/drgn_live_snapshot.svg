<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img"><title>Live drgn NVMe request snapshot</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs><rect width="1100" height="710" fill="#ffffff"/><text x="60" y="42" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" text-anchor="start" font-weight="bold" fill="#111827">Live drgn snapshot: request -&gt; SQE -&gt; PRP -&gt; page</text><text x="60" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">Read from the running kernel while fio 4KiB QD8 was active; IOMMU is on</text><rect x="60" y="100" width="980" height="105" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="82" y="128" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#2563eb">block request</text><text x="82" y="154" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#111827">qid=1  tag=113  op=write  sector=868,834,840  len=4096</text><text x="82" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">request sector is the block-layer start; the SQE below is the command currently in the driver</text><line x1="550" y1="205" x2="550" y2="245" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="250" width="620" height="170" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="82" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#10b981">NVMe SQE (64 bytes)</text><text x="82" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#111827">op=write  cid=53361  nsid=1</text><text x="82" y="334" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#111827">SLBA=868,834,904  NLB=7  bytes=4096</text><text x="82" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#111827">PRP1=0xcb379000  PRP2=0x0</text><text x="82" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#dc2626">sector != SLBA here: live reads are not atomic (see note)</text><line x1="680" y1="330" x2="740" y2="330" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="245" width="300" height="175" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/><text x="762" y="275" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#f59e0b">IOMMU</text><text x="762" y="302" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">PRP1 is an IOVA</text><text x="762" y="326" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">0xcb379000 -&gt; ?</text><text x="762" y="352" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">script uses --iova-mode none</text><text x="762" y="374" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">so no IOVA -&gt; PA translation</text><text x="762" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#f59e0b">IOMMU groups=25</text><line x1="740" y1="420" x2="680" y2="480" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="480" width="620" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="82" y="510" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#2563eb">block data page (bio_vec)</text><text x="82" y="538" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#111827">phys=0x3c803b000  offset=0  len=4096</text><text x="82" y="566" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">PRP1 IOVA and this physical page are different because IOMMU is on</text><rect x="740" y="450" width="300" height="150" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="762" y="480" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#111827">queue snapshot</text><text x="762" y="506" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">qid0 admin: depth=32</text><text x="762" y="530" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">qid1..15 io: depth=1024</text><text x="762" y="554" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">tail==head: yes</text><text x="762" y="578" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">tail range: 140..1018</text><text x="60" y="650" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">Snapshot values: sector=868,834,840, SLBA=868,834,904, PRP1=0xcb379000, bio phys=0x3c803b000.</text><text x="60" y="672" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">For strict sector/SLBA correlation use tracefs; for PRP-list contents enable an IOMMU-aware translator.</text></svg>