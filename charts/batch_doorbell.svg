<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>NVMe batching and doorbell counts</title><rect width="1000" height="540" fill="#ffffff"/><text x="60.0" y="40.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#111827" opacity="1.0">NVMe submission batching (all matrix runs)</text><text x="60.0" y="64.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">nvme_queue_rqs batches, submit calls and commands</text><line x1="210.0" y1="120.0" x2="210.0" y2="290.0" stroke="#e5e7eb" stroke-width="1"/><text x="210.0" y="312.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">100</text><line x1="419.0" y1="120.0" x2="419.0" y2="290.0" stroke="#e5e7eb" stroke-width="1"/><text x="419.0" y="312.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">1,000</text><line x1="628.1" y1="120.0" x2="628.1" y2="290.0" stroke="#e5e7eb" stroke-width="1"/><text x="628.1" y="312.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">10,000</text><line x1="837.1" y1="120.0" x2="837.1" y2="290.0" stroke="#e5e7eb" stroke-width="1"/><text x="837.1" y="312.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">100,000</text><text x="196.0" y="167.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">batch len 1</text><rect x="210.0" y="150.0" width="649.1" height="26.0" fill="#2563eb" stroke="none" rx="4" opacity="1.0"/><text x="867.1" y="168.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#2563eb" opacity="1.0">127,490</text><text x="196.0" y="237.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">batch len 2</text><rect x="210.0" y="220.0" width="337.0" height="26.0" fill="#f59e0b" stroke="none" rx="4" opacity="1.0"/><text x="555.0" y="238.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#f59e0b" opacity="1.0">4,096</text><rect x="60.0" y="330.0" width="880.0" height="150.0" fill="#f9fafb" stroke="#e5e7eb" rx="8" opacity="1.0"/><text x="84.0" y="364.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">queue_rqs calls</text><text x="300.0" y="364.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#111827" opacity="1.0">131,586</text><text x="84.0" y="396.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">NVMe commands</text><text x="300.0" y="396.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#111827" opacity="1.0">135,682</text><text x="520.0" y="364.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">submit calls</text><text x="700.0" y="364.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#111827" opacity="1.0">131,586</text><text x="520.0" y="396.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">commands / submit</text><text x="700.0" y="396.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#111827" opacity="1.0">1.031</text><text x="84.0" y="438.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">All 4,096 batch-length-2 entries are the 512B write extra 3,584B + 512B pairs; every other phase uses batch length 1.</text><text x="84.0" y="460.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">One submit/doorbell group per queue_rqs call -&gt; only ~3% fewer doorbells than commands in this workload.</text></svg>