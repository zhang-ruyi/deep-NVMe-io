<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>DMA bytes versus fio bytes</title><rect width="1000" height="600" fill="#ffffff"/><text x="150.0" y="36.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#111827" opacity="1.0">DMA bytes / fio bytes (write)</text><text x="150.0" y="60.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">512B write amplifies to 30.0 MiB for a 16.0 MiB fio workload</text><line x1="150.0" y1="102.0" x2="150.0" y2="560.0" stroke="#e5e7eb" stroke-width="1"/><text x="150.0" y="582.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">0.0x</text><line x1="337.5" y1="102.0" x2="337.5" y2="560.0" stroke="#e5e7eb" stroke-width="1"/><text x="337.5" y="582.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">0.5x</text><line x1="525.0" y1="102.0" x2="525.0" y2="560.0" stroke="#e5e7eb" stroke-width="1"/><text x="525.0" y="582.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">1.0x</text><line x1="712.5" y1="102.0" x2="712.5" y2="560.0" stroke="#e5e7eb" stroke-width="1"/><text x="712.5" y="582.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">1.5x</text><line x1="900.0" y1="102.0" x2="900.0" y2="560.0" stroke="#e5e7eb" stroke-width="1"/><text x="900.0" y="582.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" opacity="1.0">2.0x</text><text x="138.0" y="116.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">512</text><rect x="150.0" y="101.0" width="703.1" height="16.0" fill="#dc2626" stroke="none" rx="3" opacity="1.0"/><text x="859.1" y="115.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#dc2626" opacity="1.0">1.875x  (30 / 16 MiB)</text><text x="138.0" y="154.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">1k</text><rect x="150.0" y="139.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="153.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="192.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">2k</text><rect x="150.0" y="177.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="191.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="230.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">4k</text><rect x="150.0" y="215.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="229.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="268.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">8k</text><rect x="150.0" y="253.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="267.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="306.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">16k</text><rect x="150.0" y="291.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="305.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="344.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">32k</text><rect x="150.0" y="329.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="343.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="382.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">64k</text><rect x="150.0" y="367.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="381.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="420.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">128k</text><rect x="150.0" y="405.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="419.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="458.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">256k</text><rect x="150.0" y="443.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="457.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="496.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">512k</text><rect x="150.0" y="481.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="495.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="138.0" y="534.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="end" font-weight="bold" fill="#111827" opacity="1.0">1m</text><rect x="150.0" y="519.0" width="375.0" height="16.0" fill="#10b981" stroke="none" rx="3" opacity="1.0"/><text x="531.0" y="533.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#10b981" opacity="1.0">1.000x</text><text x="150.0" y="565.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280" opacity="1.0">Split at &gt;128KiB does not amplify bytes: each 128KiB command carries one quarter of a 512KiB fio IO, etc.</text></svg>